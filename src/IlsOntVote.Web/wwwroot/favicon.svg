<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Fond sombre arrondi : lisible sur onglet clair comme sombre -->
  <rect width="32" height="32" rx="7" fill="#16191d"/>
  <!-- Bulletin qui entre dans l'urne -->
  <rect x="12" y="4" width="8" height="12" rx="1.2" fill="#ffffff" transform="rotate(-9 16 10)"/>
  <!-- Urne (rouge de la marque) et sa fente -->
  <rect x="6" y="14" width="20" height="13" rx="2.5" fill="#ef5b57"/>
  <rect x="10.5" y="17" width="11" height="2.4" rx="1.2" fill="#16191d"/>
</svg>
